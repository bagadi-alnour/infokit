<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>InfoKit — Interactive Prototype (Demo data)</title>
    <style>
      /* ============================================================
   InfoKit — Airtable-inspired tokens (DESIGN.md §2–§4)
   Light is the source palette; dark is derived, same hierarchy.
   ============================================================ */
      :root {
        --canvas: #f4f8fa;
        --surface: #ffffff;
        --surface-subtle: #eaf1f4;
        --ink: #142a35;
        --muted: #536b76;
        --border: #d2dfe4;
        --border-strong: #9fb5be;
        --accent: #245f8f;
        --accent-hover: #1b4b72;
        --accent-soft: #dfedf7;
        --success: #267254;
        --success-soft: #e3f2eb;
        --warning: #8a5b12;
        --warning-soft: #f9ecce;
        --danger: #a53e49;
        --danger-soft: #f8e5e7;
        --neutral: #586d77;
        --neutral-soft: #e7eef1;
        --cat-food: #d97706;
        --cat-water: #1677a8;
        --cat-clothing: #7c5cc4;
        --cat-showers: #167c80;
        --cat-charging: #b25e09;
        --cat-health: #c13f5a;
        --cat-legal: #4867b1;
        --cat-info: #52606d;
        --cat-shelter: #3e7a4e;
        --cat-material: #6e7b3d;
        --cat-activities: #ad4a8e;
        --shadow:
          0 1px 2px rgba(27, 97, 201, 0.06), 0 4px 14px rgba(27, 97, 201, 0.07);
        --r-btn: 12px;
        --r-card: 16px;
        --r-panel: 24px;
        color-scheme: light;
      }
      [data-theme="dark"] {
        --canvas: #0f141c;
        --surface: #161c26;
        --surface-subtle: #1c2330;
        --ink: #e7eaf0;
        --muted: #9aa4b4;
        --border: #2a3242;
        --border-strong: #414d63;
        --accent: #6fa3ef;
        --accent-hover: #8fb8f4;
        --accent-soft: #182a47;
        --success: #4cc38a;
        --success-soft: #132a1e;
        --warning: #e3b558;
        --warning-soft: #2c2310;
        --danger: #f0808a;
        --danger-soft: #331519;
        --neutral: #9aa4b4;
        --neutral-soft: #232b39;
        --cat-food: #f0a045;
        --cat-water: #4fa8d8;
        --cat-clothing: #a78be0;
        --cat-showers: #4fb0b4;
        --cat-charging: #e09a4f;
        --cat-health: #e77b93;
        --cat-legal: #7e9be0;
        --cat-info: #94a3b4;
        --cat-shelter: #6fb183;
        --cat-material: #a9b86a;
        --cat-activities: #d689bf;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        height: 100%;
      }
      body {
        font-family:
          Inter,
          "Helvetica Neue",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--canvas);
        color: var(--ink);
        font-size: 16px;
        line-height: 1.5;
        min-height: 100%;
      }
      [dir="rtl"] body,
      [dir="rtl"] button,
      [dir="rtl"] input {
        letter-spacing: 0;
      }
      h1,
      h2,
      h3 {
        line-height: 1.2;
        font-weight: 650;
      }
      h1 {
        font-size: 30px;
      }
      h2 {
        font-size: 22px;
      }
      h3 {
        font-size: 17px;
        font-weight: 600;
      }
      a {
        color: var(--accent);
      }
      img,
      svg {
        max-width: 100%;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .icon {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .icon.sm {
        width: 16px;
        height: 16px;
      }
      .icon.lg {
        width: 24px;
        height: 24px;
      }
      [dir="rtl"] .flip {
        transform: scaleX(-1);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* ---------- Demo banner (prototype chrome, not product UI) ---------- */
      #demoBar {
        position: sticky;
        top: 0;
        z-index: 60;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
        background:
          repeating-linear-gradient(
            45deg,
            var(--warning-soft),
            var(--warning-soft) 12px,
            transparent 12px,
            transparent 24px
          ),
          var(--surface-subtle);
        border-bottom: 1px solid var(--border);
      }
      #demoBar .grow {
        flex: 1;
      }
      #demoBar button {
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 12.5px;
        font-weight: 600;
        background: var(--surface);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
      }
      #demoBar button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      [data-theme="dark"] #demoBar button[aria-pressed="true"] {
        color: #0f141c;
      }

      /* ---------- Public shell ---------- */
      header.pub {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--canvas);
        border-bottom: 1px solid var(--border);
      }
      .pubHead {
        max-width: 1200px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 18px;
        color: var(--ink);
        text-decoration: none;
      }
      .mark {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        width: 22px;
        height: 22px;
      }
      .mark i {
        border-radius: 5px;
      }
      .mark i:nth-child(1) {
        background: var(--accent);
      }
      .mark i:nth-child(2) {
        background: var(--success);
      }
      .mark i:nth-child(3) {
        background: var(--warning);
      }
      .mark i:nth-child(4) {
        background: var(--cat-clothing);
      }
      nav.desk {
        display: none;
        gap: 2px;
        margin-inline-start: 12px;
      }
      nav.desk a {
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 14px;
        padding: 8px 12px;
        border-radius: 10px;
      }
      nav.desk a[aria-current="page"] {
        color: var(--accent);
        background: var(--accent-soft);
      }
      nav.desk a:hover {
        color: var(--ink);
      }
      .headTools {
        margin-inline-start: auto;
        display: flex;
        gap: 8px;
      }
      .toolBtn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--r-btn);
        background: var(--surface);
        font-weight: 600;
        font-size: 14px;
      }
      .toolBtn:hover {
        border-color: var(--border-strong);
      }
      main.pub {
        max-width: 1200px;
        margin: auto;
        padding: 20px 16px 96px;
      }
      @media (min-width: 768px) {
        nav.desk {
          display: flex;
        }
        main.pub {
          padding-bottom: 48px;
        }
        .bottomNav {
          display: none !important;
        }
      }

      /* ---------- Bottom nav (mobile) ---------- */
      .bottomNav {
        position: fixed;
        bottom: 0;
        inset-inline: 0;
        z-index: 50;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: var(--canvas);
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .bottomNav button,
      .bottomNav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 2px 9px;
        min-height: 56px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
      }
      .bottomNav .on {
        color: var(--accent);
      }

      /* ---------- Buttons / chips / cards ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: var(--r-btn);
        font-weight: 600;
        font-size: 15px;
        border: 1px solid transparent;
        text-decoration: none;
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
      }
      [data-theme="dark"] .btn.primary {
        color: #0f141c;
      }
      .btn.primary:hover {
        background: var(--accent-hover);
      }
      .btn.sec {
        background: var(--surface);
        border-color: var(--border-strong);
        color: var(--ink);
      }
      .btn.sec:hover {
        border-color: var(--accent);
      }
      .btn.ghost {
        color: var(--accent);
      }
      .btn.danger {
        background: var(--danger);
        color: #fff;
      }
      .btn.smb {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 14px;
        border-radius: 10px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 13.5px;
        font-weight: 600;
        min-height: 34px;
        color: var(--ink);
      }
      button.chip:hover {
        border-color: var(--border-strong);
      }
      .chip[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        padding: 16px;
      }
      @media (min-width: 768px) {
        .card {
          padding: 20px;
        }
      }
      a.card {
        display: block;
        text-decoration: none;
        color: inherit;
      }
      a.card:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow);
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---------- Status + freshness ---------- */
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 650;
      }
      .status.open {
        background: var(--success-soft);
        color: var(--success);
      }
      .status.closed {
        background: var(--neutral-soft);
        color: var(--neutral);
      }
      .status.cancelled {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .status.uncertain {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .liveDot {
        position: relative;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        flex: none;
      }
      .liveDot::after {
        content: "";
        position: absolute;
        inset: -4px;
        border: 2px solid var(--success);
        border-radius: 50%;
        animation: liveBeat 1.8s ease-out infinite;
      }
      @keyframes liveBeat {
        0% {
          opacity: 0.7;
          transform: scale(0.45);
        }
        70%,
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }
      .fresh {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .fresh.bad {
        color: var(--warning);
        font-weight: 600;
      }
      .warnBox {
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--warning-soft);
        border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent);
        color: var(--ink);
        font-size: 14.5px;
      }
      .warnBox .icon {
        color: var(--warning);
      }
      .dangerBox {
        background: var(--danger-soft);
        border-color: color-mix(in srgb, var(--danger) 35%, transparent);
      }
      .dangerBox .icon {
        color: var(--danger);
      }
      .infoBox {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .infoBox .icon {
        color: var(--accent);
      }
      .noteAI {
        display: inline-flex;
        gap: 6px;
        align-items: flex-start;
        font-size: 12.5px;
        color: var(--muted);
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        padding: 6px 10px;
      }

      /* ---------- Service cards ---------- */
      .svcGrid {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 900px) {
        .svcGrid.cols {
          grid-template-columns: 1fr 1fr;
        }
      }
      .svc .top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .svc h3 {
        font-size: 18px;
        margin-top: 6px;
      }
      .catBadge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 650;
      }
      .catBadge .dot {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
      }
      .catBadge .dot .icon {
        width: 15px;
        height: 15px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-top: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .meta .it {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .provider {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 13.5px;
        font-weight: 600;
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        flex: none;
      }
      .aud {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 3px 10px;
      }
      .cardFoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        gap: 8px;
      }

      /* ---------- Tiles (Basic information) ---------- */
      .tiles {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      @media (min-width: 640px) {
        .tiles {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 1024px) {
        .tiles {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 14px;
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        background: var(--surface);
        text-decoration: none;
        color: inherit;
        min-height: 112px;
      }
      .tile:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow);
      }
      .tile .dot {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
      }
      .tile b {
        font-size: 14.5px;
        line-height: 1.25;
      }
      .tile span {
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- Inputs / segmented ---------- */
      .search {
        position: relative;
        display: flex;
        align-items: center;
      }
      .search .icon {
        position: absolute;
        inset-inline-start: 14px;
        color: var(--muted);
      }
      .search input {
        width: 100%;
        min-height: 48px;
        padding: 10px 14px;
        padding-inline-start: 44px;
        border: 1px solid var(--border-strong);
        border-radius: var(--r-btn);
        font: inherit;
        background: var(--surface);
        color: var(--ink);
      }
      .search input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 0;
        border-color: var(--accent);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border-strong);
        border-radius: 11px;
        overflow: hidden;
      }
      .seg button {
        padding: 8px 16px;
        font-weight: 600;
        font-size: 14px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-height: 40px;
        color: var(--muted);
        background: var(--surface);
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }
      [data-theme="dark"] .seg button[aria-pressed="true"] {
        color: #0f141c;
      }
      .field {
        display: grid;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
      }
      .field input,
      .field select,
      .field textarea {
        font: inherit;
        font-weight: 400;
        min-height: 40px;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        padding: 8px 12px;
        background: var(--surface);
        color: var(--ink);
        width: 100%;
      }

      /* ---------- Map placeholder ---------- */
      .mapBox {
        position: relative;
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        overflow: hidden;
        background: var(--surface-subtle);
      }
      .mapBox svg.bg {
        display: block;
        width: 100%;
        height: 340px;
      }
      .pin {
        position: absolute;
        transform: translate(-50%, -100%);
        display: grid;
        place-items: center;
      }
      .pin .pinDot {
        width: 30px;
        height: 30px;
        border-radius: 50% 50% 50% 4px;
        transform: rotate(-45deg);
        display: grid;
        place-items: center;
        border: 2px solid var(--canvas);
        box-shadow: var(--shadow);
      }
      .pin .pinDot .icon {
        transform: rotate(45deg);
        width: 14px;
        height: 14px;
        color: #fff;
      }
      .mapNote {
        position: absolute;
        inset-inline: 12px;
        bottom: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13.5px;
      }

      /* ---------- Detail page ---------- */
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        margin-bottom: 14px;
      }
      .detailHead {
        display: grid;
        gap: 8px;
      }
      .factList {
        display: grid;
        gap: 0;
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        overflow: hidden;
      }
      .fact {
        display: flex;
        gap: 12px;
        padding: 13px 16px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        font-size: 14.5px;
      }
      .fact:first-child {
        border-top: none;
      }
      .fact .icon {
        color: var(--muted);
        margin-top: 2px;
      }
      .fact b {
        display: block;
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
      }
      [dir="rtl"] .fact b {
        letter-spacing: 0;
      }
      .schRow {
        display: flex;
        justify-content: space-between;
        padding: 9px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 14.5px;
      }
      .schRow:last-child {
        border: none;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 6px;
      }
      @media (min-width: 640px) {
        .actions {
          display: flex;
        }
      }

      /* ---------- Simulator ---------- */
      .sim {
        max-width: 560px;
        margin: auto;
      }
      .progress {
        font-size: 13px;
        font-weight: 650;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .simOpts {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .simOpt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--border-strong);
        border-radius: var(--r-card);
        background: var(--surface);
        font-weight: 600;
        font-size: 15.5px;
        text-align: start;
        min-height: 56px;
      }
      .simOpt:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .simFoot {
        display: flex;
        justify-content: space-between;
        margin-top: 18px;
        gap: 8px;
        flex-wrap: wrap;
      }
      .simTrack {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .simTrack > i {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: inherit;
        transition: width 0.25s ease;
      }
      .simSummary {
        border-inline-start: 4px solid var(--accent);
        background: var(--surface-subtle);
        padding: 16px 18px;
      }
      .summaryGrid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .summaryFact {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 9px;
        align-items: start;
      }
      .summaryFact .icon {
        color: var(--accent);
        margin-top: 2px;
      }
      .summaryFact small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.35px;
      }
      .recommendList {
        display: grid;
        gap: 14px;
      }
      .recommendCard {
        position: relative;
        display: grid;
        grid-template-columns: 44px 1fr;
        border: 1px solid var(--border);
        background: var(--surface);
        overflow: hidden;
        text-decoration: none;
        color: inherit;
      }
      .recommendCard:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow);
      }
      .recommendRank {
        display: grid;
        place-items: start center;
        padding-top: 18px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 18px;
        font-weight: 750;
      }
      .recommendBody {
        padding: 16px;
      }
      .recommendWhy {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        margin: 10px 0;
        padding: 9px 10px;
        border-inline-start: 3px solid var(--success);
        background: var(--success-soft);
        color: var(--success);
        font-size: 13px;
        font-weight: 650;
      }
      .recommendMeta {
        display: grid;
        gap: 7px;
        margin-top: 10px;
        font-size: 14px;
        color: var(--muted);
      }
      @media (min-width: 560px) {
        .summaryGrid {
          grid-template-columns: 1fr 1fr;
        }
        .recommendBody {
          padding: 18px 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .liveDot::after {
          animation: none;
          opacity: 0;
        }
        .simTrack > i {
          transition: none;
        }
      }

      /* ---------- Listen control ---------- */
      .listen {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        background: var(--surface-subtle);
      }
      .playBtn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        flex: none;
      }
      [data-theme="dark"] .playBtn {
        color: #0f141c;
      }
      .track {
        flex: 1;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--border);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.3s linear;
      }

      /* ---------- Workspace shell ---------- */
      #wsShell {
        min-height: 100vh;
        background: var(--surface-subtle);
      }
      .wsTop {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: var(--canvas);
        border-bottom: 1px solid var(--border);
      }
      .orgTag {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        font-size: 15px;
      }
      .roleChip {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 3px 9px;
        border-radius: 999px;
      }
      .wsBody {
        display: grid;
        grid-template-columns: 1fr;
        max-width: 1280px;
        margin: auto;
      }
      @media (min-width: 900px) {
        .wsBody {
          grid-template-columns: 236px 1fr;
        }
      }
      .wsNav {
        display: none;
        padding: 16px 10px;
        gap: 2px;
      }
      @media (min-width: 900px) {
        .wsNav {
          display: grid;
          align-content: start;
        }
      }
      .wsNav button {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        color: var(--muted);
        text-align: start;
        min-height: 38px;
      }
      .wsNav button.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .wsNav button:hover {
        color: var(--ink);
      }
      main.ws {
        padding: 20px 16px 60px;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .wsGrid {
        display: grid;
        gap: 16px;
      }
      @media (min-width: 1100px) {
        .wsGrid {
          grid-template-columns: 1.4fr 1fr;
        }
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-card);
      }
      .panel > h3 {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel .cnt {
        font-size: 12px;
        font-weight: 700;
        background: var(--warning-soft);
        color: var(--warning);
        border-radius: 999px;
        padding: 2px 9px;
      }
      .attn {
        display: flex;
        gap: 12px;
        padding: 13px 16px;
        border-top: 1px solid var(--border);
        font-size: 14px;
        align-items: flex-start;
      }
      .attn:first-of-type {
        border-top: none;
      }
      .attn .icon {
        margin-top: 2px;
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .tbl th {
        padding: 9px 16px;
        text-align: start;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        border-bottom: 1px solid var(--border);
      }
      [dir="rtl"] .tbl th {
        letter-spacing: 0;
      }
      .tbl td {
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl tr:hover td {
        background: var(--surface-subtle);
      }
      .audit {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        font-size: 13.5px;
        display: grid;
        gap: 2px;
      }
      .audit:first-of-type {
        border-top: none;
      }

      /* ---------- Dialogs & toast ---------- */
      dialog {
        border: 1px solid var(--border);
        border-radius: var(--r-panel);
        background: var(--surface);
        color: var(--ink);
        padding: 0;
        max-width: min(560px, calc(100vw - 32px));
        width: 100%;
        box-shadow: var(--shadow);
      }
      dialog::backdrop {
        background: rgba(15, 20, 28, 0.55);
        backdrop-filter: blur(2px);
      }
      .dlgHead {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .dlgHead h3 {
        flex: 1;
      }
      .dlgBody {
        padding: 18px 20px;
        display: grid;
        gap: 14px;
        max-height: 70vh;
        overflow: auto;
      }
      .dlgFoot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
      }
      .langOpt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border: 1px solid var(--border-strong);
        border-radius: 14px;
        font-weight: 600;
        font-size: 16px;
        background: var(--surface);
        text-align: start;
      }
      .langOpt small {
        color: var(--muted);
        font-weight: 500;
      }
      .langOpt[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      #toast {
        position: fixed;
        bottom: 76px;
        inset-inline-start: 50%;
        transform: translateX(-50%);
        z-index: 80;
        background: var(--ink);
        color: var(--canvas);
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        max-width: calc(100vw - 40px);
        text-align: center;
      }
      [dir="rtl"] #toast {
        transform: translateX(50%);
      }
      #toast.show {
        opacity: 1;
      }
      pre.shareTxt {
        font:
          13.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: var(--surface-subtle);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        white-space: pre-wrap;
        direction: ltr;
        text-align: left;
      }
      .offBar {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--neutral-soft);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 14px;
        margin-bottom: 14px;
      }

      /* ---------- Demo state switcher ---------- */
      .stateSw {
        border: 1px dashed var(--border-strong);
        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        font-size: 12.5px;
        color: var(--muted);
      }
      .stateSw button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 600;
        background: var(--surface);
      }
      .stateSw button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      [data-theme="dark"] .stateSw button[aria-pressed="true"] {
        color: #0f141c;
      }

      @media print {
        #demoBar,
        .bottomNav,
        header.pub,
        .actions,
        .stateSw,
        .cardFoot .btn,
        #toast {
          display: none !important;
        }
        body {
          background: #fff;
          color: #000;
        }
        .card,
        .factList {
          border-color: #999;
        }
      }
    </style>
  </head>
  <body>
    <!-- Prototype control bar (not product UI) -->
    <div id="demoBar" role="region" aria-label="Prototype controls">

      <span class="grow"></span>

      </button>
      <button id="dbWs" aria-pressed="false" onclick="go('#/workspace')">

      <button id="dbTheme" onclick="cycleTheme()" aria-label="Theme">

      </button>
      <button id="dbOffline" aria-pressed="false" onclick="toggleOffline()">
        Offline demo
      </button>
      <button id="dbCity" aria-pressed="false" onclick="toggleCity()">
        + Ville Démo B

    <!-- ================= PUBLIC SHELL ================= -->

          </a>
          <nav class="desk" id="deskNav" aria-label="Main"></nav>

          </div>
        </div>
      </header>
      <main class="pub" id="pubView" tabindex="-1"></main>
      <nav class="bottomNav" id="bottomNav" aria-label="Main"></nav>
    </div>

    <!-- ================= WORKSPACE SHELL ================= -->
    <div id="wsShell" hidden>
      <div class="wsTop">
        <span class="orgTag"
          ><span class="avatar" style="background: var(--cat-food)">A</span>
          Association Démo A</span
        >
        <span class="roleChip" id="wsRole">Editor</span>
        <span class="grow" style="flex: 1"></span>
        <button
          class="toolBtn"

      </div>
    </div>

    <div id="toast" role="status"></div>

    <!-- Dialogs -->
    <dialog id="dlgLang" aria-label="Language">
      <div class="dlgHead">
        <h3 data-t="lang.title">Language</h3>
        <button
          class="toolBtn"
          style="min-height: 36px"
          onclick="dlgLang.close()"

          ✕
        </button>
      </div>
      <div class="dlgBody" id="langList"></div>
    </dialog>

    <dialog id="dlgShare">
      <div class="dlgHead">
        <h3 id="shareTitle"></h3>
        <button
          class="toolBtn"
          style="min-height: 36px"
          onclick="dlgShare.close()"

          ✕

      </div>
      <div class="dlgBody">
        <p class="small muted" id="shareHint"></p>
        <pre class="shareTxt" id="shareBody"></pre>
      </div>
      <div class="dlgFoot">
        <button
          class="btn sec smb"
          onclick="dlgShare.close()"
          id="shareClose"
        ></button>
        <button
          class="btn primary smb"
          id="shareCopy"
          onclick="copyShare()"
        ></button>
      </div>
    </dialog>

    <dialog id="dlgClosure">
      <div class="dlgHead">
        <h3 id="cloTitle">Publish an exceptional closure</h3>
        <button
          class="toolBtn"
          style="min-height: 36px"
          onclick="dlgClosure.close()"
        >
          ✕
        </button>
      </div>
      <div class="dlgBody">
        <label class="field"
          >Service
          <select id="cloSvc"></select>
        </label>
        <label class="field"
          >Affected occurrence
          <select id="cloOcc">
            <option>Today — Friday 17 July 2026</option>
          </select>
        </label>
        <label class="field"
          >Public reason
          <input id="cloReason" value="Demo operational reason" />
        </label>
        <div class="noteAI" id="cloLangNote"></div>
        <div>
          <b
            class="small muted"
            style="text-transform: uppercase; letter-spacing: 0.4px"
            >Public preview</b
          >
          <div class="card" style="margin-top: 6px" id="cloPreview"></div>
        </div>
      </div>
      <div class="dlgFoot">
        <button class="btn sec smb" onclick="dlgClosure.close()">Cancel</button>
        <button class="btn primary smb" onclick="publishClosure()">
          Publish
        </button>
      </div>
    </dialog>

        const p = state.sim.profile;

          return ["families_only", "children_only"].includes(svc.aud);

        return pool
          .map((svc) => {

              ? Math.hypot(svc.mapX - loc.x, svc.mapY - loc.y)
              : 50;
            const fit = simAudienceFit(svc);
            return {
              svc,
              dist,
              fit,
              score:
                (svc.status === "open" ? 35 : 0) +

      function wrapCanvasText(ctx, text, maxWidth) {
        const words = String(text).split(/\s+/),
          lines = [];
        let line = "";
        for (const word of words) {
          const test = line ? line + " " + word : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = word;
          } else line = test;
        }
        if (line) lines.push(line);
        return lines;
      }
      function downloadSimPdf() {
        toast(t("sim.downloading"));
        const canvas = document.createElement("canvas");
        canvas.width = 1240;
        canvas.height = 1754;
        const ctx = canvas.getContext("2d");
        const rtl = state.lang === "ar";
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = rtl ? "right" : "left";
        ctx.direction = rtl ? "rtl" : "ltr";
        const x = rtl ? 1120 : 120,
          max = 1000;
        let y = 130;
        const draw = (
          text,
          size = 26,
          color = "#142A35",
          weight = 400,
          gap = 12,
        ) => {
          ctx.font = `${weight} ${size}px Arial, sans-serif`;
          ctx.fillStyle = color;
          const lines = wrapCanvasText(ctx, text, max);
          for (const line of lines) {
            ctx.fillText(line, x, y);
            y += size * 1.35;
          }
          y += gap;
        };
        draw("InfoKit", 30, "#245F8F", 700, 8);
        draw(t("sim.result"), 48, "#142A35", 700, 36);
        draw(t("sim.summary"), 28, "#536B76", 700, 14);
        simSummaryData().forEach(([, k, v]) =>
          draw(`${t(k)}: ${v}`, 25, "#142A35", 600, 5),
        );
        y += 24;
        draw(t("sim.recommendations"), 30, "#142A35", 700, 16);
        const ranked = simRankedItems().slice(0, 4);
        if (!ranked.length) draw(t("sim.noMatch"), 24, "#536B76", 400, 18);
        ranked.forEach(({ svc }, i) => {
          draw(`${i + 1}. ${tx(svc.name).text}`, 27, "#245F8F", 700, 2);
          draw(
            `${t("status." + svc.status)} · ${tx(svc.time).text}`,
            22,
            "#267254",
            600,
            0,
          );
          draw(tx(svc.place).text, 22, "#536B76", 400, 18);
        });
        y = Math.min(y + 20, 1600);
        draw(t("sim.pdfNote"), 20, "#536B76", 400, 4);
        draw(t("sim.source"), 18, "#536B76", 400, 0);
        const data = canvas.toDataURL("image/jpeg", 0.9),
          jpg = Uint8Array.from(atob(data.split(",")[1]), (c) =>
            c.charCodeAt(0),
          ),
          enc = new TextEncoder(),
          parts = [];
        let offset = 0;
        const offsets = [0];
        const add = (v) => {
          const b = typeof v === "string" ? enc.encode(v) : v;
          parts.push(b);
          offset += b.length;
        };
        const obj = (n, body) => {
          offsets[n] = offset;
          add(`${n} 0 obj\n${body}\nendobj\n`);
        };
        add("%PDF-1.4\n%PDFJS\n");
        obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
        obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
        obj(
          3,
          "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>",
        );
        offsets[4] = offset;
        add(
          `4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,
        );
        add(jpg);
        add("\nendstream\nendobj\n");
        const content = "q\n595 0 0 842 0 0 cm\n/Im0 Do\nQ";
        obj(
          5,
          `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
        );
        const xref = offset;
        add("xref\n0 6\n0000000000 65535 f \n");
        for (let i = 1; i <= 5; i++)
          add(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
        add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
        const blob = new Blob(parts, { type: "application/pdf" }),
          a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `infokit-guide-${new Date().toISOString().slice(0, 10)}.pdf`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast(t("sim.downloaded"));
      }

      /* ---------- demo state switcher (detail page) ---------- */
      function demoState(id, st) {
        const s = SVCS.find((x) => x.id === id);
        s.status = st;
        render();
      }
      function demoOutdated(id) {
        const s = SVCS.find((x) => x.id === id);
        s.days = s.days >= 30 ? 0 : 41;
        s.verified = s.days ? "06/06 · 10:00" : "17/07 · 09:20";
        render();
      }

      /* ---------- share ---------- */
      function openShare(id) {
        const s = SVCS.find((x) => x.id === id);
        const n = tx(s.name),
          p = tx(s.place),
          ti = tx(s.time);
        $("#shareTitle").textContent = t("act.share");
        $("#shareHint").textContent = t("share.hint");
        $("#shareClose").textContent = t("act.close");
        $("#shareCopy").textContent = t("act.copy");
        $("#shareBody").textContent =
          `${n.text} — ${t("status." + s.status).toUpperCase()}
${ti.text}
${p.text}
${t("fresh.verified")} ${s.verified} · ${t("aud." + s.aud)}
https://demo.infokit.org/s/${s.id}`;
        dlgShare.showModal();
      }
      function copyShare() {
        const txt = $("#shareBody").textContent;
        (navigator.clipboard
          ? navigator.clipboard.writeText(txt)
          : Promise.reject()
        )
          .then(() => toast(t("act.copied")))
          .catch(() => toast(t("act.copied") + " (demo)"));
      }

      /* ---------- listen (fake player, no autoplay) ---------- */
      let playTimer = null;
      function togglePlay() {
        state.playing = !state.playing;
        clearInterval(playTimer);
        if (state.playing) {
          playTimer = setInterval(() => {
            state.playPct = Math.min(100, state.playPct + 2);
            const b = $("#playBar");
            if (b) b.style.width = state.playPct + "%";
            if (state.playPct >= 100) {
              state.playing = false;
              state.playPct = 0;
              clearInterval(playTimer);
              const p = $("#playBtn");
              if (p) p.innerHTML = icon("play");
            }
          }, 300);
        }
        const p = $("#playBtn");
        if (p) p.innerHTML = icon(state.playing ? "pause" : "play");
      }

      /* =========================================================
   Language / theme / router / shell
   ========================================================= */
      const LANGS = [
        ["en", "English", "English"],
        ["fr", "Français", "French"],
        ["ar", "العربية", "Arabic"],
      ];
      function openLang() {
        $("#langList").innerHTML =
          `<p class="small muted">${t("lang.note")}</p>` +
          LANGS.map(
            ([
              c,
              nat,
              en,
            ]) => `<button class="langOpt" aria-pressed="${state.lang === c}" onclick="setLang('${c}')">
     ${icon("globe", "icon sm")}<span style="flex:1">${nat}</span><small>${en}</small>${state.lang === c ? icon("check", "icon sm") : ""}</button>`,
          ).join("");
        dlgLang.showModal();
      }
      function setLang(c) {
        state.lang = c;
        dlgLang.close();
        document.documentElement.lang = c;
        document.documentElement.dir = c === "ar" ? "rtl" : "ltr";
        render();
      }
      const mq = matchMedia("(prefers-color-scheme: dark)");
      function applyTheme() {
        const mode =
          state.theme === "auto"
            ? mq.matches
              ? "dark"
              : "light"
            : state.theme;
        document.documentElement.dataset.theme = mode;
        $("#dbTheme").textContent = {
          auto: "◐ Auto",
          light: "☀ Light",
          dark: "● Dark",
        }[state.theme];
      }
      mq.addEventListener("change", () => {
        if (state.theme === "auto") applyTheme();
      });
      function cycleTheme() {
        state.theme = { auto: "light", light: "dark", dark: "auto" }[
          state.theme
        ];
        applyTheme();
      }
      function toggleOffline() {
        state.offline = !state.offline;
        $("#dbOffline").setAttribute("aria-pressed", state.offline);
        render();
      }
      function toggleCity() {
        const on = !CITIES.villeb.active;
        CITIES.villeb.active = on;
        $("#dbCity").setAttribute("aria-pressed", on);
        state.sim = simReset();
        if (!on && state.filters.city === "villeb")
          state.filters.city = "calais";
        toast(
          on
            ? "City added — the simulator now asks which city"
            : "City removed — single-city mode",
        );
        render();
      }

      function go(h) {
        location.hash = h;
      }
      function route() {
        let h = location.hash || "#/home";
        const qi = h.indexOf("?");
        if (qi > -1) {
          const ps = new URLSearchParams(h.slice(qi + 1));
          if (ps.get("cat")) state.filters.cat = ps.get("cat");
          h = h.slice(0, qi);
          history.replaceState(null, "", "#/services");
        }
        return h;
      }
      const PUB_NAV = [
        ["#/home", "nav.home", "home"],
        ["#/services", "nav.services", "map"],
        ["#/simulator", "nav.sim", "help"],
        ["#/articles", "nav.articles", "file"],
        ["#/associations", "nav.assoc", "users"],
      ];
      function render() {
        const h = route();
        const ws = h.startsWith("#/workspace");
        $("#publicShell").hidden = ws;
        $("#wsShell").hidden = !ws;
        $("#dbPublic").setAttribute("aria-pressed", !ws);
        $("#dbWs").setAttribute("aria-pressed", ws);
        document.querySelector('[data-t="demo.label"]').textContent =
          t("demo.label");
        if (ws) {
          $("#wsView").innerHTML = vWorkspace();
          return;
        }
        /* desktop nav */
        $("#deskNav").innerHTML = PUB_NAV.map(
          ([href, k]) =>
            `<a href="${href}" ${h === href || h.startsWith(href + "/") ? 'aria-current="page"' : ""}>${t(k)}</a>`,
        ).join("");
        $("#langBtn").innerHTML =
          icon("globe", "icon sm") + LANGS.find((l) => l[0] === state.lang)[1];
        /* bottom nav: Home, Services, Guide, Language, More (PRD 10.2) */
        const bn = [
          ["#/home", "nav.home", "home"],
          ["#/services", "nav.services", "map"],
          ["#/simulator", "nav.sim", "help"],
        ];
        $("#bottomNav").innerHTML =
          bn
            .map(
              ([href, k, ic]) =>
                `<a href="${href}" class="${h === href || h.startsWith(href.replace("#/", "#/").slice(0) + "/") ? "on" : ""}">${icon(ic)}<span>${t(k)}</span></a>`,
            )
            .join("") +
          `<button onclick="openLang()">${icon("globe")}<span>${t("nav.lang")}</span></button>
     <button onclick="moreSheet()">${icon("more")}<span>${t("nav.more")}</span></button>`;
        let view;
        if (h.startsWith("#/service/")) view = vServiceDetail(h.split("/")[2]);
        else if (h === "#/services") view = vServices();
        else if (h === "#/associations") view = vAssociations();
        else if (h.startsWith("#/association/")) view = vOrg(h.split("/")[2]);
        else if (h === "#/articles") view = vArticles();
        else if (h.startsWith("#/article/")) view = vArticle(h.split("/")[2]);
        else if (h === "#/simulator") view = vSimulator();
        else if (h === "#/emergency") view = vEmergency();
        else view = vHome();
        $("#pubView").innerHTML = view;
      }
      function renderKeepFocus(id) {
        const el = document.getElementById(id);
        const pos = el ? el.selectionStart : 0;
        render();
        const el2 = document.getElementById(id);
        if (el2) {
          el2.focus();
          el2.setSelectionRange(pos, pos);
        }
      }
      function moreSheet() {
        $("#langList").innerHTML =
          `<p class="small muted" style="margin-bottom:4px">${t("more.title")}</p>
   <button class="langOpt" onclick="dlgLang.close();go('#/articles')">${icon("file", "icon sm")}<span style="flex:1">${t("nav.articles")}</span>${icon("chevR", "icon sm flip")}</button>
   <button class="langOpt" onclick="dlgLang.close();go('#/associations')">${icon("users", "icon sm")}<span style="flex:1">${t("nav.assoc")}</span>${icon("chevR", "icon sm flip")}</button>`;
        dlgLang.showModal();
      }
      addEventListener("hashchange", render);
      applyTheme();
      render();
    </script>
  </body>
</html>
